<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literary Frequencies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0c0c10;
    color: #ddd8ce;
    font-family: 'Cormorant Garamond', Georgia, serif;
    padding: 2.5rem 1.5rem 4rem;
    min-height: 100vh;
    max-width: 780px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 0.5px solid rgba(221,216,206,0.12);
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 2.2rem;
    letter-spacing: 0.1em;
    color: #ddd8ce;
    margin-bottom: 0.3rem;
  }

  .header p {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.24em;
    color: rgba(221,216,206,0.28);
    text-transform: uppercase;
  }

  .api-section {
    margin-bottom: 1.75rem;
    padding: 1.1rem 1.25rem;
    border: 0.5px solid rgba(221,216,206,0.14);
    border-radius: 3px;
    background: rgba(221,216,206,0.02);
  }

  .api-section label {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(221,216,206,0.35);
    margin-bottom: 0.5rem;
  }

  .api-row { display: flex; gap: 0.6rem; align-items: center; }

  .api-hint {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.1em;
    color: rgba(221,216,206,0.22);
    margin-top: 0.5rem;
  }

  .api-hint a { color: rgba(221,216,206,0.4); }

  input[type="password"], input[type="text"] {
    flex: 1;
    background: rgba(221,216,206,0.04);
    border: 0.5px solid rgba(221,216,206,0.18);
    color: #ddd8ce;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 0.6rem 0.8rem;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: rgba(221,216,206,0.38); }

  .show-btn {
    background: transparent;
    border: 0.5px solid rgba(221,216,206,0.18);
    color: rgba(221,216,206,0.4);
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.6rem 0.75rem;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .show-btn:hover { border-color: rgba(221,216,206,0.35); color: rgba(221,216,206,0.7); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .control-group label {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(221,216,206,0.35);
    margin-bottom: 0.45rem;
  }

  select {
    width: 100%;
    background: rgba(221,216,206,0.03);
    border: 0.5px solid rgba(221,216,206,0.18);
    color: #ddd8ce;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    padding: 0.6rem 0.8rem;
    border-radius: 3px;
    appearance: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  select:hover { border-color: rgba(221,216,206,0.35); }
  select option { background: #141418; color: #ddd8ce; }

  .gen-btn {
    width: 100%;
    background: transparent;
    border: 0.5px solid rgba(221,216,206,0.3);
    color: #ddd8ce;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0.9rem;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 2rem;
  }

  .gen-btn:hover { background: rgba(221,216,206,0.05); border-color: rgba(221,216,206,0.55); }
  .gen-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .status {
    display: none;
    text-align: center;
    padding: 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(221,216,206,0.35);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

  .error {
    display: none;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: rgba(200,90,90,0.8);
    padding: 1rem 0;
    line-height: 1.7;
  }

  .playlist { display: none; }

  .pl-header {
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 0.5px solid rgba(221,216,206,0.08);
  }

  .pl-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 1.45rem;
    color: #ddd8ce;
    margin-bottom: 0.2rem;
  }

  .pl-meta {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(221,216,206,0.28);
  }

  .track {
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 1rem;
    padding: 1.2rem 0;
    border-bottom: 0.5px solid rgba(221,216,206,0.07);
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }

  .track-num {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: rgba(221,216,206,0.22);
    padding-top: 3px;
    text-align: right;
  }

  .track-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-weight: 400;
    color: #ddd8ce;
    margin-bottom: 2px;
  }

  .track-artist {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(221,216,206,0.38);
    margin-bottom: 0.55rem;
  }

  .track-tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 7px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    background: rgba(221,216,206,0.05);
    border: 0.5px solid rgba(221,216,206,0.13);
    color: rgba(221,216,206,0.42);
    margin-bottom: 0.5rem;
  }

  .track-just {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.97rem;
    line-height: 1.65;
    color: rgba(221,216,206,0.55);
  }
</style>
</head>
<body>

<div class="header">
  <h1>Literary Frequencies</h1>
  <p>A playlist generator for world literature</p>
</div>

<div class="api-section">
  <label>Anthropic API Key</label>
  <div class="api-row">
    <input type="password" id="api-key" placeholder="sk-ant-..." />
    <button class="show-btn" onclick="toggleKey(event)">Show</button>
  </div>
  <div class="api-hint">Get your key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> — never stored, only used to call Anthropic directly.</div>
</div>

<div class="controls">
  <div class="control-group">
    <label>Work</label>
    <select id="work-sel">
      <option value="">— select —</option>
      <option value="Kafka on the Shore by Haruki Murakami">Kafka on the Shore — Murakami</option>
      <option value="1Q84 by Haruki Murakami">1Q84 — Murakami</option>
      <option value="One Hundred Years of Solitude by Gabriel García Márquez">One Hundred Years of Solitude — García Márquez</option>
      <option value="Oedipus the King by Sophocles">Oedipus the King — Sophocles</option>
      <option value="selected short stories by Raymond Carver including Neighbors, Collectors, What We Talk About When We Talk About Love, and Cathedral">Raymond Carver — Selected Stories</option>
    </select>
  </div>
  <div class="control-group">
    <label>Theme</label>
    <select id="theme-sel">
      <option value="">— select —</option>
      <option value="memory and loss">Memory & Loss</option>
      <option value="isolation and loneliness">Isolation & Loneliness</option>
      <option value="fate and prophecy">Fate & Prophecy</option>
      <option value="the uncanny and surrealism">The Uncanny</option>
      <option value="love and longing">Love & Longing</option>
      <option value="identity and self-discovery">Identity & Self</option>
      <option value="time and impermanence">Time & Impermanence</option>
    </select>
  </div>
</div>

<button class="gen-btn" id="btn" onclick="generate()">Generate Playlist ↗</button>
<div class="status" id="status">Tuning the frequency…</div>
<div class="error" id="err"></div>

<div class="playlist" id="playlist">
  <div class="pl-header">
    <div class="pl-title" id="pl-title"></div>
    <div class="pl-meta" id="pl-meta"></div>
  </div>
  <div id="tracks"></div>
</div>

<script>
  function toggleKey(e) {
    const input = document.getElementById('api-key');
    if (input.type === 'password') {
      input.type = 'text';
      e.target.textContent = 'Hide';
    } else {
      input.type = 'password';
      e.target.textContent = 'Show';
    }
  }

  async function generate() {
    const apiKey = document.getElementById('api-key').value.trim();
    const workEl = document.getElementById('work-sel');
    const themeEl = document.getElementById('theme-sel');
    const work = workEl.value;
    const theme = themeEl.value;

    if (!apiKey) { alert('Please enter your Anthropic API key.'); return; }
    if (!work || !theme) { alert('Please select both a work and a theme.'); return; }

    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const err = document.getElementById('err');
    const playlist = document.getElementById('playlist');

    btn.disabled = true;
    status.style.display = 'block';
    err.style.display = 'none';
    playlist.style.display = 'none';

    try {
      const res = await fetch('/api/playlist', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ apiKey, work, theme })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');

      const { tracks } = data;

      document.getElementById('pl-title').textContent = themeEl.options[themeEl.selectedIndex].text;
      document.getElementById('pl-meta').textContent = workEl.options[workEl.selectedIndex].text + '  ·  ' + tracks.length + ' tracks';

      const container = document.getElementById('tracks');
      container.innerHTML = '';
      tracks.forEach((t, i) => {
        const el = document.createElement('div');
        el.className = 'track';
        el.style.animationDelay = (i * 0.08) + 's';
        el.innerHTML = `
          <div class="track-num">${String(i+1).padStart(2,'0')}</div>
          <div>
            <div class="track-title">${t.title}</div>
            <div class="track-artist">${t.artist}</div>
            <span class="track-tag">${t.tag}</span>
            <div class="track-just">${t.justification}</div>
          </div>`;
        container.appendChild(el);
      });

      playlist.style.display = 'block';
    } catch(e) {
      err.textContent = e.message;
      err.style.display = 'block';
    } finally {
      btn.disabled = false;
      status.style.display = 'none';
    }
  }
</script>
</body>
</html>
